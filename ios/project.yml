# XcodeGen 工程描述（纯文本，可审阅）
# 生成 .xcodeproj：  brew install xcodegen && cd ios && xcodegen generate
name: XiaoZhi
options:
  bundleIdPrefix: com.xiaozhi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGN_STYLE: Automatic
    # 开发者个人 Team（HAI ZHAO / 免费 Personal Team）；换付费账号时改这里
    DEVELOPMENT_TEAM: K82UDVDKF7
targets:
  XiaoZhi:
    type: application
    platform: iOS
    sources:
      - XiaoZhi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.co.fsr.xiaozhi
        INFOPLIST_FILE: XiaoZhi/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"   # 1,2 = iPhone + iPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: XiaoZhi/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleDisplayName: 小智
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # 出口合规：仅使用系统 TLS（HTTPS/WSS）与 Keychain，无自定义加密，声明豁免以免每次上传弹加密文稿问卷
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # xiaozhi-server 根地址（本仓库默认端口 8003）：真机测试指向 Mac 局域网 IP，
        # 需与后端同一 Wi-Fi（服务端 config.host 须为 0.0.0.0）；App 内「设置」页可覆盖此值。
        XiaoZhiBaseURL: http://192.168.1.55:8003
        # 公网服务器根地址（局域网档之外的第二服务器）：nginx 反代到 xiaozhi-server，
        # 与 WS 回落 wss://ai.fsr.co.jp/xiaozhi/v1/ 同前缀（HTTP 侧挂 /xiaozhi）；上线前按实际域名调整。
        XiaoZhiCloudBaseURL: https://ai.fsr.co.jp/xiaozhi
        # 本地真机测试允许 HTTP（服务器无 TLS 证书）；上架/生产构建前必须移除
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
