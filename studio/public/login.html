<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 小智服务器控制台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0d1117; color: #e6edf3;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .box {
    width: 320px; padding: 28px; border: 1px solid #30363d; border-radius: 10px;
    background: #161b22;
  }
  h1 { font-size: 16px; margin-bottom: 4px; }
  .sub { font-size: 12px; color: #8b949e; margin-bottom: 18px; }
  input {
    width: 100%; padding: 9px 10px; margin-bottom: 12px; border-radius: 6px;
    border: 1px solid #30363d; background: #0d1117; color: #e6edf3; font-size: 14px;
  }
  button {
    width: 100%; padding: 9px; border: none; border-radius: 6px; cursor: pointer;
    background: #238636; color: #fff; font-size: 14px;
  }
  button:disabled { opacity: .6; cursor: wait; }
  .err { color: #f85149; font-size: 12px; min-height: 16px; margin-bottom: 8px; }
</style>
</head>
<body>
  <form class="box" id="f">
    <h1>小智服务器控制台</h1>
    <div class="sub">请使用管理员账号登录</div>
    <input type="text" id="un" placeholder="用户名" autocomplete="username" value="admin">
    <input type="password" id="pw" placeholder="密码" autocomplete="current-password">
    <div class="err" id="err"></div>
    <button type="submit" id="btn">登 录</button>
  </form>
<script>
  const back = new URLSearchParams(location.search).get('redirect') || location.pathname.replace(/[^/]*$/, '');
  document.getElementById('pw').focus();
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn');
    const err = document.getElementById('err');
    btn.disabled = true; err.textContent = '';
    if (!document.getElementById('pw').value) { err.textContent = '请输入密码'; btn.disabled = false; return; }
    try {
      const res = await fetch('api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: document.getElementById('un').value.trim(), password: document.getElementById('pw').value }),
      });
      const data = await res.json();
      if (res.ok && data.ok) { location.href = back; return; }
      err.textContent = data.error || '登录失败';
    } catch (ex) {
      err.textContent = '请求失败：' + ex.message;
    }
    btn.disabled = false;
  });
</script>
</body>
</html>
