<!DOCTYPE html>
<html lang="zh-CN" class="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小智服务器控制台</title>
  <link rel="stylesheet" href="/firmware/vendor/element-plus.css" />
  <link rel="stylesheet" href="/firmware/vendor/element-plus-dark.css" />
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--el-bg-color);
    }

    #app,
    .lay {
      height: 100%;
    }

    .aside {
      border-right: 1px solid var(--el-border-color);
      display: flex;
      flex-direction: column;
    }

    .logo {
      padding: 16px 18px;
      font-weight: 700;
      font-size: 15px;
      border-bottom: 1px solid var(--el-border-color);
    }

    .logo small {
      display: block;
      color: var(--el-text-color-secondary);
      font-weight: 400;
      font-size: 11px;
      margin-top: 2px;
    }

    .el-menu {
      border-right: none !important;
    }

    .hd {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--el-border-color);
    }

    .hd h1 {
      font-size: 15px;
      margin: 0;
    }

    .hd .sp {
      flex: 1;
    }

    .main {
      padding: 18px;
      overflow: auto;
    }

    .card {
      margin-bottom: 16px;
    }

    .row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .hint {
      color: var(--el-text-color-secondary);
      font-size: 12px;
    }

    .mono {
      font-family: Menlo, monospace;
    }

    pre.log {
      background: var(--el-fill-color-light);
      border: 1px solid var(--el-border-color);
      border-radius: 8px;
      padding: 12px;
      height: 300px;
      overflow: auto;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      margin: 10px 0 0;
    }

    pre.log .ok {
      color: var(--el-color-success);
    }

    pre.log .bad {
      color: var(--el-color-danger);
    }

    pre.log .warn {
      color: var(--el-color-warning);
    }

    pre.log .blue {
      color: var(--el-color-primary);
    }

    .statv {
      font-size: 26px;
      font-weight: 700;
    }

    .stats {
      color: var(--el-text-color-secondary);
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div id="app">
    <el-config-provider :locale="locale">
      <el-container class="lay">
        <el-aside width="200px" class="aside">
          <div class="logo">🎙️ 小智服务器<small>独立运行版控制台</small></div>
          <el-menu :default-active="view" @select="go" style="flex:1">
            <el-menu-item index="overview">📊 总览</el-menu-item>
            <el-menu-item index="devices">📱 设备管理</el-menu-item>
            <el-menu-item index="convs">💬 对话记录</el-menu-item>
            <el-menu-item index="broadcast">📢 语音广播</el-menu-item>
            <el-menu-item index="firmware">🔧 固件工作台</el-menu-item>
          </el-menu>
          <div class="hint" style="padding:10px 14px;border-top:1px solid var(--el-border-color)">:{{ port }} · {{
            env.repoVersion ? 'repo ' + env.repoVersion : '' }}</div>
        </el-aside>

        <el-container>
          <el-header class="hd" height="auto">
            <h1>{{ titles[view] }}</h1>
            <span class="sp"></span>
            <el-tag v-for="(c,k) in env.checks" :key="k" :type="c.ok ? 'success' : 'danger'" size="small" effect="plain"
              :title="c.path">
              {{ checkNames[k] || k }} {{ c.ok ? '✓' : '✗' }}
            </el-tag>
            <el-button size="small" @click="refreshAll">⟳ 刷新</el-button>
          </el-header>

          <el-main class="main">
            <!-- ========== 总览 ========== -->
            <template v-if="view === 'overview'">
              <el-row :gutter="16" style="margin-bottom:16px">
                <el-col :span="6"><el-card shadow="never">
                    <div class="statv">{{ stats.registered?.devices?.total ?? '-' }}</div>
                    <div class="stats">注册设备（在线 {{ stats.registered?.devices?.online ?? 0 }}）</div>
                  </el-card></el-col>
                <el-col :span="6"><el-card shadow="never">
                    <div class="statv">{{ liveDevices.length }}</div>
                    <div class="stats">WS 实时在线</div>
                  </el-card></el-col>
                <el-col :span="6"><el-card shadow="never">
                    <div class="statv">{{ stats.registered?.conversations?.total ?? '-' }}</div>
                    <div class="stats">对话记录（今日 {{ stats.registered?.conversations?.today ?? 0 }}）</div>
                  </el-card></el-col>
                <el-col :span="6"><el-card shadow="never">
                    <div class="statv">{{ fmtUptime(health.uptime) }}</div>
                    <div class="stats">服务运行时长</div>
                  </el-card></el-col>
              </el-row>
              <el-descriptions :column="1" border class="card">
                <el-descriptions-item label="服务状态"><el-tag size="small"
                    :type="health.status === 'ok' ? 'success' : 'danger'">{{ health.status || '?' }}</el-tag> channel={{
                  health.channel || '?' }}</el-descriptions-item>
                <el-descriptions-item label="OTA 地址"><span class="mono">{{ env.otaUrl
                    }}</span>（设备端配置此地址）</el-descriptions-item>
                <el-descriptions-item label="WebSocket"><span class="mono">{{ wsUrls.current || '-'
                    }}</span></el-descriptions-item>
                <el-descriptions-item label="固件目录"><span class="mono">{{ fwDir }}</span>（{{ fwList.length }} 个固件，OTA
                  自动从此下发）</el-descriptions-item>
                <el-descriptions-item label="设备库"><span class="mono">{{ dbPath }}</span></el-descriptions-item>
                <el-descriptions-item label="固件仓库"><span class="mono">{{ env.repoVersion || '?' }}</span> 分支 {{
                  env.gitBranch || '?' }}（{{ env.checks?.repoDir?.path }}）</el-descriptions-item>
              </el-descriptions>
              <el-card shadow="never" class="card">
                <template #header><b>快捷入口</b></template>
                <el-button @click="go('firmware')">去编译固件</el-button>
                <el-button @click="go('broadcast')">发一条广播</el-button>
                <el-button @click="go('devices')">看设备</el-button>
                <el-link href="/manage" target="_blank" style="margin-left:12px">旧管理页 /manage</el-link>
                <el-link href="/chat" target="_blank" style="margin-left:12px">聊天页 /chat</el-link>
              </el-card>
            </template>

            <!-- ========== 设备管理 ========== -->
            <template v-if="view === 'devices'">
              <el-tabs v-model="devTab">
                <el-tab-pane label="注册设备（持久化）" name="known">
                  <div class="row"><el-button size="small" @click="loadKnown">⟳ 刷新</el-button>
                    <el-input size="small" style="width:220px" v-model="filterKnown" placeholder="🔍 搜索 MAC/型号/IP"
                      clearable ></el-input>
                    <el-button size="small" type="warning" plain @click="openAudioSettings">⚙ 语音灵敏度</el-button>
                    <span class="hint">共 {{ known.total }} 台，当前显示 {{ filteredKnown.length }} 台</span></div>
                  <el-table :data="filteredKnown" size="small" max-height="560">
                    <el-table-column prop="device_id" label="MAC / 设备ID" width="200"><template #default="s"><span
                          class="mono">{{ s.row.device_id }}</span></template></el-table-column>
                    <el-table-column prop="model" label="型号" width="150"><template #default="s"><el-tag size="small"
                          effect="plain">{{ s.row.model || '-' }}</el-tag></template></el-table-column>
                    <el-table-column prop="firmware_version" label="固件" width="90" ></el-table-column>
                    <el-table-column label="在线" width="70"><template #default="s"><el-tag v-if="Number(s.row.online)"
                          type="success" size="small">在线</el-tag><span v-else
                          class="hint">离线</span></template></el-table-column>
                    <el-table-column prop="ip" label="IP" width="130"><template #default="s"><span class="mono">{{
                          s.row.ip || '-' }}</span></template></el-table-column>
                    <el-table-column prop="connect_count" label="连接次数" width="90" ></el-table-column>
                    <el-table-column label="最近连接" min-width="160"><template #default="s">{{ fmtTs(s.row.last_seen)
                        }}</template></el-table-column>
                    <el-table-column label="首次接入" min-width="160"><template #default="s">{{ fmtTs(s.row.first_seen)
                        }}</template></el-table-column>
                  </el-table>
                  <el-pagination style="margin-top:10px" layout="prev, pager, next" :total="known.total" :page-size="50"
                    v-model:current-page="knownPage" @current-change="loadKnown" ></el-pagination>
                </el-tab-pane>
                <el-tab-pane :label="'当前在线（WS）' + (liveDevices.length ? ' · ' + liveDevices.length : '')" name="live">
                  <div class="row"><el-button size="small" @click="loadLive">⟳ 刷新</el-button>
                    <el-input size="small" style="width:220px" v-model="filterLive" placeholder="🔍 搜索 设备ID/IP/型号"
                      clearable ></el-input>
                    <span class="hint">本次启动后建立 WebSocket 连接的设备</span></div>
                  <el-table :data="filteredLive" size="small" max-height="480">
                    <el-table-column v-for="c in liveCols" :key="c" :prop="c" :label="c" min-width="140"
                      show-overflow-tooltip>
                      <template #default="s"><span class="mono">{{ cell(s.row[c]) }}</span></template>
                    </el-table-column>
                    <el-table-column label="操作" width="240" fixed="right"><template #default="s">
                        <el-button size="small" type="primary" plain
                          @click="openSendTo(s.row)">发语音</el-button>
                        <el-button size="small" @click="showDeviceDetail(s.row)">详情</el-button>
                        <el-button size="small" type="danger" plain
                          @click="disconnectDevice(s.row)">断开</el-button>
                      </template></el-table-column>
                  </el-table>
                  <el-empty v-if="!liveDevices.length" description="当前没有设备在线" ></el-empty>
                </el-tab-pane>
              </el-tabs>

              <!-- 语音灵敏度(VAD振幅阈值)设定对话框 -->
              <el-dialog v-model="audioSettingsVisible" title="语音有效性阈值设定（VAD 振幅）" width="480px">
                <el-form label-width="130px">
                  <el-form-item label="最大振幅阈值">
                    <el-input-number v-model="audioSettings.minMaxAmplitude" :min="0" :max="10000" :step="50" ></el-input-number>
                  </el-form-item>
                  <el-form-item label="平均振幅阈值">
                    <el-input-number v-model="audioSettings.minAvgAmplitude" :min="0" :max="10000" :step="5" ></el-input-number>
                  </el-form-item>
                  <el-form-item label="静默阈值(ms)">
                    <el-input-number v-model="audioSettings.silenceThresholdMs" :min="300" :max="5000" :step="100" ></el-input-number>
                  </el-form-item>
                </el-form>
                <div class="hint" style="line-height:1.7">振幅低于任一阈值的音频视为噪音，不触发识别、不发起对话轮次。<br>静默阈值：realtime 常开麦下，说话停顿超过该时长才判定“一句话说完”并触发识别；值太小会把长句切碎成短句碎片（建议 1200~1500ms）。<br>环境嘈杂时调大振幅数值；保存后立即生效（服务器默认值，重启不丢）。</div>
                <template #footer>
                  <el-button @click="audioSettingsVisible=false">取消</el-button>
                  <el-button type="primary" @click="saveAudioSettings"
                    :loading="audioSettingsSaving">保存设定</el-button>
                </template>
              </el-dialog>

              <!-- 向单台设备发语音对话框 -->
              <el-dialog v-model="sendVisible" title="向设备发语音（TTS 播报）" width="460px">
                <div class="row"><span class="mono">目标: {{ sendForm.deviceId || '全部在线设备' }}</span></div>
                <el-input type="textarea" :rows="3" v-model="sendForm.text" placeholder="输入要播报的文字…" maxlength="500" show-word-limit ></el-input>
                <template #footer>
                  <el-button @click="sendVisible=false">取消</el-button>
                  <el-button type="primary" @click="doSendTo" :loading="sendForm.sending">发送</el-button>
                </template>
              </el-dialog>

              <!-- 设备详情对话框 -->
              <el-dialog v-model="detailVisible" title="设备详情" width="560px">
                <pre class="mono" style="max-height:420px;overflow:auto;background:#f6f7fa;padding:12px;border-radius:6px">{{ detailDevice ? JSON.stringify(detailDevice, null, 2) : '' }}</pre>
              </el-dialog>
            </template>

            <!-- ========== 对话记录 ========== -->
            <template v-if="view === 'convs'">
              <div class="row">
                <el-input v-model="convFilter.deviceId" placeholder="按设备ID过滤" clearable style="max-width:240px" ></el-input>
                <el-select v-model="convFilter.role" style="width:130px"><el-option value="" label="全部角色" ></el-option><el-option
                    value="user" label="user" ></el-option><el-option value="bot" label="bot" ></el-option></el-select>
                <el-button type="primary" size="small" @click="loadConvs(1)">查询</el-button>
                <span class="hint">共 {{ convs.total }} 条</span>
              </div>
              <el-table :data="convs.items" size="small" max-height="560">
                <el-table-column label="时间" width="160"><template #default="s">{{ fmtTs(s.row.created_at)
                    }}</template></el-table-column>
                <el-table-column prop="device_id" label="设备" width="180"><template #default="s"><span class="mono">{{
                      s.row.device_id || '-' }}</span></template></el-table-column>
                <el-table-column label="角色" width="80"><template #default="s"><el-tag size="small"
                      :type="s.row.role === 'user' ? 'info' : 'success'">{{ s.row.role
                      }}</el-tag></template></el-table-column>
                <el-table-column prop="text" label="内容" min-width="300" show-overflow-tooltip ></el-table-column>
                <el-table-column prop="emotion" label="表情" width="90" ></el-table-column>
                <el-table-column prop="provider" label="来源" width="100" ></el-table-column>
              </el-table>
              <el-pagination style="margin-top:10px" layout="prev, pager, next" :total="convs.total" :page-size="50"
                v-model:current-page="convPage" @current-change="loadConvs" ></el-pagination>
            </template>

            <!-- ========== 语音广播 ========== -->
            <template v-if="view === 'broadcast'">
              <el-card shadow="never" style="max-width:640px">
                <template #header><b>向在线小智设备播报</b></template>
                <div class="row">
                  <span class="hint">目标</span>
                  <el-select v-model="bcDevice" style="width:260px" placeholder="全部在线设备">
                    <el-option value="" label="全部在线设备" ></el-option>
                    <el-option v-for="d in known.items.filter(x => Number(x.online))" :key="d.device_id"
                      :value="d.device_id" :label="`${d.model || '设备'} · ${d.device_id}`" ></el-option>
                  </el-select>
                </div>
                <div>
                  <el-input v-model="bcText" type="textarea" :rows="4" maxlength="500" show-word-limit
                    placeholder="要播报的文字，设备将语音朗读" ></el-input>
                </div>
                <div class="row" style="margin-top:10px">
                  <el-button type="primary" :loading="bcSending" @click="broadcast()">📢 发送广播</el-button>
                  <span class="hint">合成+推流异步执行，发送后设备稍候开口。</span>
                </div>
              </el-card>
            </template>

            <!-- ========== 固件工作台 ========== -->
            <template v-if="view === 'firmware'">
              <el-card class="card" shadow="never">
                <template #header><b>① 自动识别设备 / 板型</b></template>
                <div class="row">
                  <el-button type="primary" :loading="detecting" @click="detect">⟳ 检测最近连接的设备</el-button>
                  <span class="hint">{{ detectHint }}</span>
                </div>
                <el-table v-if="devices.length" :data="devices" size="small" max-height="220">
                  <el-table-column prop="device_id" label="设备ID"><template #default="s"><span class="mono">{{
                        s.row.device_id }}</span></template></el-table-column>
                  <el-table-column prop="model" label="型号" width="160" ></el-table-column>
                  <el-table-column prop="firmware_version" label="固件" width="100" ></el-table-column>
                  <el-table-column label="状态" width="80"><template #default="s"><el-tag v-if="Number(s.row.online)"
                        type="success" size="small">在线</el-tag><span v-else
                        class="hint">离线</span></template></el-table-column>
                  <el-table-column prop="last_seen" label="最近连接" width="180" ></el-table-column>
                </el-table>
              </el-card>

              <el-card class="card" shadow="never">
                <template #header><b>② 选择板型 &amp; 核对版本</b></template>
                <div class="row">
                  <el-input v-model="boardFilter" placeholder="关键字过滤，如 xmini / lichuang（共 {{ boards.length }} 个变体）"
                    clearable style="max-width:420px" ></el-input>
                </div>
                <div class="row">
                  <el-select v-model="boardSel" filterable placeholder="选择板型" style="min-width:340px">
                    <el-option v-for="b in boardOptions" :key="b.v" :value="b.v" :label="b.label" ></el-option>
                  </el-select>
                  <span class="hint mono">{{ boardMeta }}</span>
                  <el-button :loading="checking" @click="checkRelease">查官方最新版</el-button>
                </div>
                <div class="hint" style="margin-bottom:10px">
                  本地仓库版本 <b class="mono">{{ env.repoVersion || '?' }}</b>
                  <template v-if="rel">｜官方最新 <b class="mono">{{ rel.latest || '?' }}</b></template>
                  <el-tag v-if="rel && !rel.error && relBehind" size="small" type="warning">本地落后，可先 git 切 tag
                    再编译</el-tag>
                  <el-tag v-else-if="rel && !rel.error" size="small" type="success">本地为最新或更新</el-tag>
                  <span v-if="rel && !rel.error && rel.zipForBoard">｜官方有该板型预编译包（仅整片镜像，不能用于 OTA）</span>
                  <span v-if="rel && rel.error" class="hint">官方版本查询失败：{{ rel.error }}</span>
                </div>
                <div class="row">
                  <span class="hint">同步源码</span>
                  <el-input v-model="syncRef" placeholder="官方最新 tag 已预填；留空 = git pull" style="max-width:300px" ></el-input>
                  <el-button :loading="syncing" @click="sync">⬇ git 拉取 / 切 tag</el-button>
                </div>
              </el-card>

              <el-card class="card" shadow="never">
                <template #header><b>③ 编译（build.py 权威构建 → 注入私有 OTA 地址 → 纯 app 镜像）</b></template>
                <div class="row">
                  <span class="hint">主 OTA 地址</span>
                  <el-input v-model="env.otaUrl" style="max-width:480px" ></el-input>
                </div>
                <div class="row">
                  <span class="hint">备用 OTA 地址</span>
                  <div style="flex:1;max-width:480px">
                    <el-input v-model="env.otaUrlFallback" placeholder="留空 = 不启用；如 http://你的网络服务器:8003/xiaozhi/ota/" ></el-input>
                    <div class="hint">主地址连不上（开发机关机/断网）时设备自动改用备用地址。需固件含 OTA 双地址补丁（本仓库源码已打，编译即带）。</div>
                  </div>
                </div>
                <div class="row">
                  <span class="hint">Flash 容量</span>
                  <el-select v-model="flashSize" style="width:230px">
                    <el-option label="16MB（官方标准）" value="16MB" ></el-option>
                    <el-option label="8MB（v2/8m 分区表）" value="8MB" ></el-option>
                  </el-select>
                  <span class="hint">按芯片实际 flash 容量选择，错了会导致 assets 分区写不下</span>
                </div>
                <div class="row">
                  <span class="hint">唤醒词</span>
                  <el-select v-model="ww.mode" style="width:230px">
                    <el-option label="固件内置（不注入）" value="default" ></el-option>
                    <el-option label="自定义 · Multinet（仅 S3/P4）" value="custom" ></el-option>
                  </el-select>
                </div>
                <div v-if="ww.mode === 'custom'" class="row" style="align-items:flex-start">
                  <span class="hint">自定义唤醒词</span>
                  <div style="flex:1;max-width:540px">
                    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
                      <el-input v-model="ww.word" placeholder="拼音空格分隔: ni hao xiao dou" style="width:220px" ></el-input>
                      <el-input v-model="ww.display" placeholder="显示名(可选): 你好小豆" style="width:150px" ></el-input>
                      <span class="hint">灵敏度(越小越灵敏)</span>
                      <el-input-number v-model="ww.threshold" :min="1" :max="99" size="small" ></el-input-number>
                    </div>
                    <div class="hint">仅 ESP32-S3/P4/S31（带 PSRAM）支持；C3/C5/C6 不可自定义（只能换乐鑫预置模型，详见固件仓库
                      GALA-WAKEWORD.md）。拼音留空 = 不注入。</div>
                  </div>
                </div>
                <div class="row">
                  <el-button type="success" :disabled="building" @click="build">▶ 开始编译</el-button>
                  <el-button :disabled="!building" @click="stopWatch">停止跟踪（后台继续）</el-button>
                  <span class="hint">首次编译约数分钟，之后增量。</span>
                </div>
                <pre class="log"
                  ref="logEl"><div v-for="(l,i) in logLines" :key="i" :class="l.c">{{ l.t }}</div><div v-if="!logLines.length">编译日志将显示在这里…</div></pre>
                <div class="row" v-if="artifact" style="margin-top:12px">
                  <span style="color:var(--el-color-success)">产物就绪：{{ artifact.type }} {{ artifact.version }}（纯 app
                    镜像）</span>
                  <el-button type="primary" :loading="installing" @click="install()">📦 安装到 OTA 目录（data/bin）</el-button>
                </div>
              </el-card>

              <el-card class="card" shadow="never">
                <template #header>
                  <div style="display:flex;align-items:center;gap:10px">
                    <b>✓ 已安装固件</b><span class="hint mono">{{ fwDir }}</span>
                    <el-button size="small" style="margin-left:auto" @click="loadFirmware">⟳ 刷新</el-button>
                  </div>
                </template>
                <div class="hint" style="margin-bottom:6px">设备下次连上
                  OTA（<code>/xiaozhi/ota/</code>）时，若此处有型号匹配且版本更高的固件即自动升级。</div>
                <el-table :data="fwList" size="small" max-height="260">
                  <el-table-column prop="filename" label="文件"><template #default="s"><span class="mono">{{
                        s.row.filename }}</span></template></el-table-column>
                  <el-table-column prop="model" label="型号" width="150" ></el-table-column>
                  <el-table-column prop="version" label="版本" width="100" ></el-table-column>
                  <el-table-column label="大小" width="90"><template #default="s">{{ mb(s.row.size) }}
                      MB</template></el-table-column>
                  <el-table-column label="时间" width="180"><template #default="s">{{ fmtTs(s.row.mtime)
                      }}</template></el-table-column>
                  <el-table-column label="" width="80"><template #default="s"><el-button size="small" type="danger"
                        plain @click="delFirmware(s.row.filename)">删除</el-button></template></el-table-column>
                </el-table>
              </el-card>

              <el-card class="card" shadow="never">
                <template #header><b>④ USB 直接烧录（可选 · 危险）</b></template>
                <div class="row">
                  <span class="hint">串口</span>
                  <el-select v-model="portSel" placeholder="选择串口" style="min-width:260px">
                    <el-option v-for="p in env.ports" :key="p" :value="p" :label="p" ></el-option>
                  </el-select>
                  <el-button size="small" @click="refreshPorts">⟳</el-button>
                  <el-button type="danger" :loading="flashing" @click="flash">🔥 烧录当前 build 到设备</el-button>
                </div>
                <div class="hint">烧录前需已完成一次编译；设备需处于可烧录态。会改写设备固件，请确认型号无误。</div>
                <pre v-if="flashing || flashLines.length" class="log"
                  style="height:200px"><div v-for="(l,i) in flashLines" :key="i" :class="l.c">{{ l.t }}</div></pre>
              </el-card>
            </template>
          </el-main>
        </el-container>
      </el-container>
    </el-config-provider>
  </div>

  <script src="/firmware/vendor/vue.js"></script>
  <script src="/firmware/vendor/element-plus.js"></script>
  <script src="/firmware/vendor/locale-zh-cn.js"></script>
  <script>
    const { createApp, ref, reactive, computed, nextTick, onMounted, watch } = Vue;
    const { ElMessage, ElMessageBox } = ElementPlus;

    const apiGet = (u) => fetch(u).then((r) => r.json());
    const apiPost = (u, b) => fetch(u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b || {}) }).then((r) => r.json());
    const cmpVer = (a, b) => { const pa = String(a).match(/\d+/g)?.map(Number) || [], pb = String(b).match(/\d+/g)?.map(Number) || []; const n = Math.max(pa.length, pb.length); for (let i = 0; i < n; i++) { const x = pa[i] || 0, y = pb[i] || 0; if (x > y) return 1; if (x < y) return -1; } return 0; };
    const ask = (msg, title) => ElMessageBox.confirm(msg, title || '安全确认', { type: 'warning', confirmButtonText: '确认', cancelButtonText: '取消' }).then(() => true).catch(() => false);

    async function readStream(resp, onObj) {
      const reader = resp.body.getReader(); const dec = new TextDecoder(); let buf = '';
      for (; ;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf('\n')) >= 0) {
          const raw = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
          if (raw.startsWith('data:')) { try { onObj(JSON.parse(raw.slice(5).trim())); } catch { /* ignore */ } }
        }
      }
    }

    createApp({
      setup() {
        const locale = ElementPlusLocaleZhCn;
        const checkNames = { repoDir: '仓库', idfExport: 'ESP-IDF', idfPython: 'Python', dataBinDir: '安装目录', deviceDb: '设备库', llmBridge: 'LLM·aibridge', funasr: 'STT·FunASR' };
        const titles = { overview: '总览', devices: '设备管理', convs: '对话记录', broadcast: '语音广播', firmware: '固件工作台' };
        const view = ref(location.hash.replace(/^#\/?/, '') || 'overview');
        const port = ref(location.port || '?');

        // ---- 全局/环境 ----
        const env = reactive({ checks: {}, ports: [], repoVersion: '', gitBranch: '', otaUrl: '', otaUrlFallback: '', allOk: false });
        const flashSize = ref('16MB');
        const fwDir = ref(''); const dbPath = ref('');
        const health = reactive({}); const stats = reactive({}); const wsUrls = reactive({});

        // ---- 设备 ----
        const devTab = ref('known');
        const known = reactive({ total: 0, items: [] }); const knownPage = ref(1);
        const liveDevices = ref([]);
        // 设备管理：搜索过滤 + 语音灵敏度 + 单发语音 + 详情（自旧 manage 页合并）
        const filterKnown = ref(''); const filterLive = ref('');
        const filteredKnown = computed(() => { const q = filterKnown.value.toLowerCase().trim(); if (!q) return known.items; return known.items.filter((d) => [d.device_id, d.model, d.ip, d.firmware_version].some((v) => String(v || '').toLowerCase().includes(q))); });
        const filteredLive = computed(() => { const q = filterLive.value.toLowerCase().trim(); if (!q) return liveDevices.value; return liveDevices.value.filter((d) => [d.clientId, d.deviceId, d.mac, d.ip, d.type, d.status, d.name, d.version].some((v) => String(v || '').toLowerCase().includes(q))); });
        const audioSettingsVisible = ref(false); const audioSettingsSaving = ref(false);
        const audioSettings = reactive({ minMaxAmplitude: 500, minAvgAmplitude: 50, silenceThresholdMs: 1500 });
        const sendVisible = ref(false); const sendForm = reactive({ deviceId: '', text: '', sending: false });
        const detailVisible = ref(false); const detailDevice = ref(null);
        const liveCols = computed(() => (liveDevices.value[0] ? Object.keys(liveDevices.value[0]).filter((k) => !['features', 'audio_params'].includes(k)) : []));

        // ---- 对话 ----
        const convs = reactive({ total: 0, items: [] }); const convPage = ref(1);
        const convFilter = reactive({ deviceId: '', role: '' });

        // ---- 广播 ----
        const bcText = ref(''); const bcDevice = ref(''); const bcSending = ref(false);

        // ---- 固件工作台 ----
        const devices = ref([]); const boards = ref([]); const boardFilter = ref(''); const boardSel = ref('');
        const rel = ref(null); const fwList = ref([]); const portSel = ref('');
        const logLines = ref([]); const flashLines = ref([]); const logEl = ref(null);
        const artifact = ref(null); const detectHint = ref('点检测：优先读 USB 描述符（序列号=MAC）精确识别当前连接设备。');
        const syncRef = ref('');
        const detecting = ref(false); const checking = ref(false); const syncing = ref(false);
        const building = ref(false); const installing = ref(false); const flashing = ref(false);
        let currentJob = null; let watching = true;

        const boardOptions = computed(() => {
          const f = boardFilter.value.trim().toLowerCase();
          return boards.value
            .filter((b) => !f || (b.type + b.name + (b.full_name || '') + (b.display_name || '')).toLowerCase().includes(f))
            .map((b) => ({ v: [b.board, b.name, b.type, b.target, b.config].join('|||'), label: `${b.type}${b.display_name && b.display_name !== b.type ? ' — ' + b.display_name : ''} (${b.target})` }));
        });
        const boardMeta = computed(() => {
          if (!boardSel.value) return '';
          const [board, name, type, target, config] = boardSel.value.split('|||');
          return `dir=${board} · name=${name} · type=${type} · target=${target} · ${config}`;
        });
        const relBehind = computed(() => rel.value?.latest && env.repoVersion && cmpVer(rel.value.latest, env.repoVersion) > 0);

        const push = (arr, t, c = '') => { arr.value.push({ t, c }); if (arr.value.length > 3000) arr.value.shift(); };
        const scrollLog = () => nextTick(() => { if (logEl.value) logEl.value.scrollTop = logEl.value.scrollHeight; });
        const mb = (s) => (s / 1024 / 1024).toFixed(2);
        const fmtTs = (ts) => (ts ? new Date(Number(ts)).toLocaleString() : '-');
        const fmtUptime = (sec) => (!sec ? '-' : sec > 3600 ? `${Math.floor(sec / 3600)}h${Math.floor((sec % 3600) / 60)}m` : `${Math.floor(sec / 60)}m${Math.floor(sec % 60)}s`);
        const cell = (v) => (v === null || v === undefined ? '-' : typeof v === 'object' ? JSON.stringify(v) : String(v));

        // ---- 视图切换 ----
        function go(v) { view.value = v; location.hash = `/${v}`; refreshView(v); }
        function refreshView(v) {
          if (v === 'overview') loadOverview();
          if (v === 'devices') { loadKnown(); loadLive(); }
          if (v === 'convs') loadConvs(1);
          if (v === 'firmware') { loadEnv(); loadFirmware(); }
        }
        async function refreshAll() { await Promise.all([loadEnv(), loadOverview(), loadKnown(), loadLive(), loadConvs(), loadFirmware(), loadConfig()]); ElMessage.success('已刷新'); }

        // ---- 总览 ----
        async function loadOverview() {
          const [h, s, w] = await Promise.all([apiGet('/health'), apiGet('/api/devices/stats'), apiGet('/api/websocket/urls')]);
          Object.assign(health, h); Object.assign(stats, s); Object.assign(wsUrls, w);
        }
        async function loadConfig() {
          const c = await apiGet('/firmware/api/config');
          fwDir.value = c.dataBinDir; dbPath.value = c.deviceDb; port.value = location.port || '80';
        }

        // ---- 设备 ----
        async function loadKnown() {
          const r = await apiGet(`/api/devices/known?limit=50&offset=${(knownPage.value - 1) * 50}`);
          known.total = r.total; known.items = r.items || [];
        }
        async function loadLive() {
          const r = await apiGet('/api/devices');
          liveDevices.value = Array.isArray(r) ? r : [];
        }

        // ---- 对话 ----
        async function loadConvs(p) {
          if (typeof p === 'number') convPage.value = p;
          const q = new URLSearchParams({ limit: 50, offset: (convPage.value - 1) * 50 });
          if (convFilter.deviceId) q.set('deviceId', convFilter.deviceId);
          if (convFilter.role) q.set('role', convFilter.role);
          const r = await apiGet('/api/conversations?' + q);
          convs.total = r.total; convs.items = r.items || [];
        }

        // ---- 广播 ----
        async function broadcast() {
          if (!bcText.value.trim()) { ElMessage.warning('请输入广播内容'); return; }
          bcSending.value = true;
          try {
            const body = { text: bcText.value.trim() };
            if (bcDevice.value) body.deviceId = bcDevice.value;
            const r = await apiPost('/api/broadcast', body);
            if (r.success) ElMessage.success(`已受理，正在播报到 ${r.devices} 台在线设备`);
            else ElMessage.error(r.error || '发送失败');
          } catch (e) { ElMessage.error('请求异常：' + e.message); } finally { bcSending.value = false; }
        }
        function broadcastTo(devId) { bcDevice.value = devId || ''; go('broadcast'); }

        // ── 语音有效性阈值(VAD)设定：热更新 + 持久化 ──
        async function openAudioSettings() {
          try { const r = await apiGet('/api/settings/audio'); if (r.ok && r.thresholds) Object.assign(audioSettings, r.thresholds); }
          catch (e) { ElMessage.error('读取阈值失败: ' + e.message); }
          audioSettingsVisible.value = true;
        }
        async function saveAudioSettings() {
          audioSettingsSaving.value = true;
          try {
            const r = await apiPost('/api/settings/audio', { ...audioSettings });
            if (r.ok) { ElMessage.success(`已保存并即时生效: max=${r.thresholds.minMaxAmplitude}, avg=${r.thresholds.minAvgAmplitude}, 静默=${r.thresholds.silenceThresholdMs}ms` + (r.persisted ? '' : '（未能写入配置文件）')); audioSettingsVisible.value = false; }
            else ElMessage.error(r.error || '保存失败');
          } catch (e) { ElMessage.error('保存失败: ' + e.message); }
          finally { audioSettingsSaving.value = false; }
        }

        // ── 向单台设备发语音（复用 /api/broadcast 定向播报）──
        function openSendTo(row) { sendForm.deviceId = row.deviceId || row.mac || row.device_id || row.id || ''; sendForm.text = ''; sendVisible.value = true; }
        async function doSendTo() {
          if (!sendForm.text.trim()) { ElMessage.warning('请输入要播报的文字'); return; }
          sendForm.sending = true;
          try {
            const r = await apiPost('/api/broadcast', { deviceId: sendForm.deviceId || undefined, text: sendForm.text.trim() });
            if (r.success) { ElMessage.success(`已受理，正在播报到 ${r.devices} 台设备`); sendVisible.value = false; }
            else ElMessage.error(r.error || '发送失败');
          } catch (e) { ElMessage.error('发送失败: ' + e.message); }
          finally { sendForm.sending = false; }
        }

        // ── 设备详情 / 断开连接 ──
        function showDeviceDetail(row) { detailDevice.value = row; detailVisible.value = true; }
        async function disconnectDevice(row) {
          const label = row.deviceId || row.mac || row.clientId;
          if (!(await ask(`确定断开设备 ${label} 的 WebSocket 连接？设备端会自动重连。`, '断开确认'))) return;
          try {
            const r = await apiPost('/api/disconnect', { clientId: row.clientId });
            if (r.success) { ElMessage.success('已断开'); loadLive(); loadKnown(); }
            else ElMessage.error(r.error || '断开失败');
          } catch (e) { ElMessage.error('请求失败: ' + e.message); }
        }

        // ---- 固件工作台逻辑 ----
        async function loadEnv() {
          Object.assign(env, await apiGet('/firmware/api/env'));
          if (!env.allOk) push(logLines, '⚠ 环境检查有缺失项（见顶部红叉），编译可能失败。', 'warn');
        }
        async function loadBoards() {
          const r = await apiGet('/firmware/api/boards');
          boards.value = r.items || [];
          if (r.error) push(logLines, '板型加载错误：' + r.error, 'bad');
        }
        async function loadFirmware() {
          const r = await apiGet('/firmware/api/firmware');
          fwList.value = r.items || []; fwDir.value = r.dir || fwDir.value;
        }
        async function refreshPorts() { Object.assign(env, await apiGet('/firmware/api/env')); if (!env.ports.includes(portSel.value)) portSel.value = env.ports[0] || ''; }

        async function detect() {
          detecting.value = true; detectHint.value = '检测中…';
          try {
            const [d, dv] = await Promise.all([apiGet('/firmware/api/detect'), apiGet('/firmware/api/devices')]);
            devices.value = dv.items || [];
            detectHint.value = d.hint;
            if (d.ports) env.ports = d.ports;
            if (d.matched) {
              const b = d.matched.board;
              boardFilter.value = ''; boardSel.value = [b.board, b.name, b.type, b.target, b.config].join('|||');
              push(logLines, `✓ 已自动选中板型：${b.type}（识别方式 ${d.matched.via}）`, 'ok'); scrollLog();
            }
          } finally { detecting.value = false; }
        }

        let relTimer = null;
        watch(boardSel, (v) => {
          if (!v) return;
          clearTimeout(relTimer);
          relTimer = setTimeout(checkRelease, 400); // 换板型自动核对官方版本，防抖避免连打 GitHub
        });
        async function loadSyncDefault() {
          // 预填"同步源码"为官方最新 tag（离线/失败则保持留空 = git pull）
          try {
            const r = await apiGet('/firmware/api/releases');
            if (r.latest && !syncRef.value) syncRef.value = `v${r.latest}`;
          } catch { /* ignore */ }
        }
        async function checkRelease() {
          const type = (boardSel.value || '').split('|||')[2];
          checking.value = true;
          try { rel.value = await apiGet('/firmware/api/releases' + (type ? `?type=${encodeURIComponent(type)}` : '')); }
          finally { checking.value = false; }
        }

        async function sync() {
          const ref_ = syncRef.value.trim();
          if (!await ask(ref_ ? `将 checkout 到 ${ref_}（会改变仓库状态），确认？` : '将执行 git pull --ff-only + submodule 更新，确认？', 'git 同步确认')) return;
          syncing.value = true;
          push(logLines, `— git 同步开始（ref=${ref_ || 'pull'}）—`, 'blue'); scrollLog();
          try {
            const resp = await fetch('/firmware/api/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ref: ref_, confirm: true }) });
            await readStream(resp, (o) => {
              if (o.done) { push(logLines, o.ok ? '✓ 同步完成' : `✗ 同步失败 code=${o.code}`, o.ok ? 'ok' : 'bad'); loadEnv(); } else if (o.line) push(logLines, o.line);
              scrollLog();
            });
          } catch (e) { push(logLines, '同步异常：' + e.message, 'bad'); } finally { syncing.value = false; }
        }

        const ww = reactive({ mode: 'default', word: '', display: '', threshold: 20 });
        async function build() {
          const [board, name, type] = (boardSel.value || '').split('|||');
          if (!board) { ElMessage.warning('请先选择板型'); return; }
          logLines.value = []; artifact.value = null; building.value = true; watching = true;
          push(logLines, `— 开始编译 ${type} (${board} --name ${name}) —`, 'blue');
          const r = await apiPost('/firmware/api/build', { board, name, type, otaUrl: env.otaUrl, otaUrlFallback: env.otaUrlFallback, flashSize: flashSize.value, wakeWord: ww.mode === 'custom' && ww.word.trim() ? { word: ww.word.trim(), display: ww.display.trim(), threshold: ww.threshold } : null });
          if (r.error) { push(logLines, r.error, 'bad'); building.value = false; return; }
          currentJob = r.jobId;
        }
        async function stopWatch() {
          const ok = await ask('仅停止页面日志跟踪，后台编译任务会继续执行，稍后可重新查看进度。确认停止跟踪？', '停止跟踪');
          if (!ok) return;
          watching = false; building.value = false; push(logLines, '（前端已停止追加，后台任务仍在进行）', 'warn');
        }

        async function install(confirm = false) {
          if (!artifact.value) return;
          installing.value = true;
          try {
            const a = artifact.value;
            const r = await apiPost('/firmware/api/install', { source: a.source, model: a.type, version: a.version, confirm });
            if (r.needConfirm) {
              installing.value = false;
              if (await ask(r.message, '覆盖确认')) return install(true);
              return;
            }
            if (r.error) { ElMessage.error('安装失败：' + r.error); return; }
            push(logLines, `✓ 已安装到 OTA 目录：${r.dest}（${mb(r.size)} MB）`, 'ok'); scrollLog();
            ElMessage.success('安装成功！设备下次 OTA 请求时将自动升级。');
            artifact.value = null;
            loadFirmware();
          } finally { installing.value = false; }
        }

        async function delFirmware(filename) {
          if (!await ask(`删除 ${filename}？`, '删除确认')) return;
          const r = await apiPost('/firmware/api/firmware/delete', { filename, confirm: true });
          if (r.ok) loadFirmware(); else ElMessage.error(r.error || r.message || '删除失败');
        }

        async function flash() {
          const [board, name] = (boardSel.value || '').split('|||');
          if (!portSel.value) { ElMessage.warning('未选择串口'); return; }
          if (!await ask(`USB 烧录会直接改写 ${portSel.value} 上设备的固件（板型 ${name || '?'}）。设备需可烧录。确认继续？`, '烧录确认')) return;
          flashing.value = true; flashLines.value = [];
          try {
            const resp = await fetch('/firmware/api/flash', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ port: portSel.value, board, name, confirm: true }) });
            await readStream(resp, (o) => { if (o.done) push(flashLines, o.ok ? '✓ 烧录完成' : `✗ 烧录失败 code=${o.code}`, o.ok ? 'ok' : 'bad'); else if (o.line) push(flashLines, o.line); });
          } catch (e) { push(flashLines, '烧录异常：' + e.message, 'bad'); } finally { flashing.value = false; }
        }

        let es = null;
        onMounted(async () => {
          es = new EventSource('/firmware/api/events');
          es.addEventListener('build:log', (e) => { const d = JSON.parse(e.data); if (watching && d.id === currentJob) { push(logLines, d.line); scrollLog(); } });
          es.addEventListener('build:done', (e) => {
            const d = JSON.parse(e.data); if (d.id !== currentJob) return;
            building.value = false;
            if (d.status === 'success') {
              const type = (boardSel.value || '').split('|||')[2] || d.type;
              artifact.value = { source: d.artifact, type, version: d.version };
              push(logLines, `✓ 编译成功：${type}_${d.version}.bin → ${d.artifact}`, 'ok');
            } else {
              push(logLines, `✗ 编译失败：${d.error || '未知'}`, 'bad');
            }
            scrollLog();
          });
          await Promise.all([loadEnv(), loadBoards(), loadFirmware(), loadConfig(), loadSyncDefault()]);
          detect().catch(() => { }); // 自动识别当前连接设备并预选板型、联动核对版本
          if (env.ports?.length) portSel.value = env.ports[0];
          refreshView(view.value);
          setInterval(() => { if (view.value === 'overview') loadOverview(); }, 15000);
        });

        return {
          locale, checkNames, titles, view, go, port, env, fwDir, dbPath, health, stats, wsUrls,
          devTab, known, knownPage, loadKnown, liveDevices, liveCols, loadLive, cell,
          filterKnown, filterLive, filteredKnown, filteredLive,
          audioSettingsVisible, audioSettingsSaving, audioSettings, openAudioSettings, saveAudioSettings,
          sendVisible, sendForm, openSendTo, doSendTo,
